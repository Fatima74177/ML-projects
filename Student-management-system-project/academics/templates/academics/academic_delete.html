{% extends 'base.html' %}
{% block content %}
<div class="card-shell">
  <h1 class="page-title">Delete Grade</h1>
  <form method="post">
    {% csrf_token %}
    <p>Delete grade for {{ object.student.full_name }}?</p>
    <button class="btn btn-danger" type="submit">Delete</button>
    <a class="btn btn-light" href="{% url 'academic_list' %}">Cancel</a>
  </form>
</div>
{% endblock %}
