{% extends 'base.html' %}
{% block content %}
<div class="card-shell">
  <h1 class="page-title">{{ object.title }}</h1>
  <p class="page-subtitle">{{ object.course_code }}</p>
  <p><strong>Teacher:</strong> {{ object.teacher|default:"-" }}</p>
  <p><strong>Schedule:</strong> {{ object.schedule }}</p>
  <p><strong>Credits:</strong> {{ object.credits }}</p>
  <a class="btn btn-light" href="{% url 'course_list' %}">Back</a>
</div>
{% endblock %}
