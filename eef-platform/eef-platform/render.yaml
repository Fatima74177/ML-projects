services:
  - type: web
    name: eef-platform
    runtime: docker
    dockerContext: .
    dockerfilePath: backend/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        value: sqlite:///./eef_demo.db
      - key: REDIS_ENABLED
        value: "false"
      - key: KAFKA_ENABLED
        value: "false"
      - key: NEO4J_ENABLED
        value: "false"
      - key: JWT_SECRET
        generateValue: true
