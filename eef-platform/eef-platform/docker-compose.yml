version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: eef-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: eef
      POSTGRES_PASSWORD: eef_dev_password
      POSTGRES_DB: eef
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eef -d eef"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [eef-net]

  redis:
    image: redis:7-alpine
    container_name: eef-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [eef-net]

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: eef-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks: [eef-net]

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: eef-kafka
    restart: unless-stopped
    depends_on: [zookeeper]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"
    networks: [eef-net]

  neo4j:
    image: neo4j:5.20-community
    container_name: eef-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/eef_neo4j_password
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [eef-net]

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: eef-backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://eef:eef_dev_password@postgres:5432/eef
      REDIS_URL: redis://redis:6379/0
      REDIS_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_ENABLED: "false"
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_ENABLED: "false"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads_data:/eef/backend/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [eef-net]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: eef-frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks: [eef-net]

  nginx:
    image: nginx:1.27-alpine
    container_name: eef-nginx
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - backend
      - frontend
    networks: [eef-net]

networks:
  eef-net:
    driver: bridge

volumes:
  postgres_data:
  neo4j_data:
  uploads_data:
